name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The POS backend generates its Prisma client at build time. Tests run against
  # a local SQLite file and mocks, so no real database is contacted.
  DATABASE_URL: file:./ci.db

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # packages/shared resolves to dist, which a fresh checkout does not have.
      # Everything downstream typechecks against it, so build it first.
      - name: Build shared contracts
        run: npm run build:shared

      # The electron suite exercises the real SQLite event log. Its pretest hook
      # puts a Node-ABI better-sqlite3 in place; this keeps that failure separate
      # from a genuine test failure.
      - name: Prepare native modules
        run: node packages/electron/scripts/native-abi.cjs node

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
