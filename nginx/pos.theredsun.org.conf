server {
    listen 80;
    listen [::]:80;
    server_name pos.theredsun.org;

    # Redirect all HTTP to HTTPS (certbot will manage this block after setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pos.theredsun.org;

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pos.theredsun.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.theredsun.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/jingles-pos/packages/web/dist;
    index index.html;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Serve React SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/jingles-pos.access.log;
    error_log  /var/log/nginx/jingles-pos.error.log;
}
