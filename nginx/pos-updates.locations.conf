# Include inside the HTTPS server block for pos.theredsun.org.

location = /updates/pos/latest.yml {
    alias /var/www/federation-inventory/desktop-updates/pos/latest.yml;
    default_type application/yaml;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /updates/pos/ {
    alias /var/www/federation-inventory/desktop-updates/pos/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
